<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const SIM = 2;                 // intro clock runs at 2x so the story keeps moving (rates below are real per-second rates)
const TURN_RATE = 3;           // deg/s, standard rate turn
const CLIMB_FPM = 2000, SPD_RATE = 3, NM_FT = 6076.12, GP_TAN = Math.tan(3 * Math.PI / 180), SWEEP_MS = 4000;
const FCOL = { red: '#ff5a6e', silver: '#c9ced6', purple: '#b48cff', copper: '#e0915a', none: '#a8f0b2' };
const FNAME = { red: 'Marshal · Red', silver: 'Approach · Silver', purple: 'Final · Purple', copper: 'Final · Copper' };
const LS_KEY = 'aatccIntro.v2', LS_MUTE = 'aatccIntroMute';
const MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));

/* ===================== callsigns + spoken numbers (mirrors approach-controller.html) ===================== */
const AIRLINES = [
  { icao: 'LTNG', tel: 'Lightning', words: ['lightning', 'lightening'] },
  { icao: 'NHWK', tel: 'Nighthawk', words: ['nighthawk', 'night hawk', 'nite hawk', 'night hawks'] },
  { icao: 'VIPR', tel: 'Viper', words: ['viper', 'vipers', 'piper'] },
  { icao: 'VENM', tel: 'Venom', words: ['venom'] },
  { icao: 'EGLE', tel: 'Eagle', words: ['eagle', 'eagles'] },
  { icao: 'RDGE', tel: 'Ridge', words: ['ridge'] },
];
const DW = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'niner'];
const sayDigits = n => String(n).split('').map(d => d === '.' ? 'point' : (DW[+d] ?? d)).join(' ');
const h3 = v => String(Math.round(v) % 360 || 360).padStart(3, '0');
function tel(cs) { const al = AIRLINES.find(a => cs.startsWith(a.icao)); return al ? al.tel + ' ' + cs.slice(al.icao.length) : cs; }
function telSay(cs) { const al = AIRLINES.find(a => cs.startsWith(a.icao)); return al ? al.tel + ' ' + sayDigits(cs.slice(al.icao.length)) : cs; }
const angTxt = alt => String(Math.round(alt / 100) / 10);
const angSay = alt => sayDigits(angTxt(alt));

const DIG = { zero: 0, oh: 0, o: 0, one: 1, two: 2, three: 3, tree: 3, four: 4, fower: 4, five: 5, fife: 5, six: 6, seven: 7, eight: 8, ait: 8, nine: 9, niner: 9 };
const TEEN = { ten: 10, eleven: 11, twelve: 12, thirteen: 13, fourteen: 14, fifteen: 15, sixteen: 16, seventeen: 17, eighteen: 18, nineteen: 19 };
const TENS = { twenty: 20, thirty: 30, forty: 40, fourty: 40, fifty: 50, sixty: 60, seventy: 70, eighty: 80, ninety: 90 };
const isWordNum = t => (t in DIG && t !== 'oh' && t !== 'o') || t in TEEN || t in TENS;
const tokVal = t => /^\d+(\.\d+)?$/.test(t) ? parseFloat(t) : (t in DIG ? DIG[t] : t in TEEN ? TEEN[t] : t in TENS ? TENS[t] : 0);
function runToStr(run) {
  if (run.includes('hundred') || run.includes('thousand')) {
    let total = 0, cur = 0, lastD = false;
    for (const t of run) {
      if (t === 'thousand') { total += (cur || 1) * 1000; cur = 0; }
      else if (t === 'hundred') cur = (cur || 1) * 100;
      else if (t !== 'point') { const v = tokVal(t); cur = (lastD && v < 10 && cur < 10) ? cur * 10 + v : cur + v; lastD = v < 10; continue; }
      lastD = false;
    }
    return String(total + cur);
  }
  let s = '';
  for (let i = 0; i < run.length; i++) {
    const t = run[i];
    if (/^\d+(\.\d+)?$/.test(t)) s += t;
    else if (t === 'point') s += '.';
    else if (t in DIG) s += String(DIG[t]);
    else if (t in TEEN) s += String(TEEN[t]);
    else if (t in TENS) { const n = run[i + 1]; if (n && n in DIG && DIG[n] > 0 && n !== 'oh' && n !== 'o') { s += String(TENS[t] + DIG[n]); i++; } else s += String(TENS[t]); }
  }
  return s.replace(/\.$/, '');
}
function normalizeSpeech(raw) {
  let s = ' ' + String(raw).toLowerCase() + ' ';
  s = s.replace(/(\d),(\d{3})/g, '$1$2');
  s = s.replace(/[’`]/g, "'");
  s = s.replace(/\bwave-?off\b|\bwaive\s+off\b|\bwave\s+of\b/g, ' wave off ');
  s = s.replace(/(\d)\.(\d)/g, '$1dot$2');
  s = s.replace(/,/g, ' , ');
  s = s.replace(/[^a-z0-9\s,]/g, ' ');
  s = s.replace(/dot/g, '.');
  s = s.replace(/\b(\d+)(miles?|knots|kts|feet|ft)\b/g, '$1 $2');
  s = s.replace(/\bglide\s*(?:path|slope|pass|bath|past)\b|\bglideslope\b/g, ' glidepath ');
  s = s.replace(/\b(dissent|decent|descents)\b/g, 'descent');
  s = s.replace(/\bnight\s*hawks?\b/g, 'nighthawk');
  s = s.replace(/\bgo\s+round\b|\bgoaround\b/g, 'go around');
  s = s.replace(/\bb\s+r\s+c\b/g, 'brc');
  s = s.replace(/\bwrite\b|\bwright\b/g, 'right').replace(/\bleft\s+of\s+cores\b/g, 'left of course');
  s = s.replace(/\bcent(?:er|re)\s*line\b/g, 'centerline');
  s = s.replace(/\b(?:hitting|hedding|heddings?|headings|header|headers|heating|hiding|heeding)(?:\s+s)?\s+(?=(?:\d+|zero|oh|one|two|to|too|three|tree|four|for|five|fife|six|seven|eight|nine|niner)\b)/g, 'heading ');
  s = s.replace(/\bheading\s+(?:to|too)\s+(?=\w)/g, 'heading two ');
  s = s.replace(/\b(?:uh+|um+|umm+|er|erm|ah+|hmm+|please|okay|ok)\b/g, ' ');
  s = s.replace(/\b(?:angel|angle)\s+s\b|\b(?:angels|angles|angel|angle)\b/g, ' angels ');
  s = s.replace(/\bknots?\b|\bkts\b/g, 'knots');
  const toks = s.split(/\s+/).filter(Boolean), out = [];
  let run = [], locked = false;
  const flush = () => { if (run.length) out.push(runToStr(run)); run = []; locked = false; };
  for (let i = 0; i < toks.length; i++) {
    const t = toks[i];
    if (t === ',') { flush(); continue; }
    const multi = /^\d{2,}(\.\d+)?$/.test(t) || /^\d+\.\d+$/.test(t), single = /^\d$/.test(t);
    if (multi) { flush(); run = [t]; locked = true; continue; }
    if (single || isWordNum(t)) { if (locked) flush(); run.push(t); continue; }
    if ((t === 'oh' || t === 'o') && run.length) { if (locked) flush(); run.push('zero'); continue; }
    if ((t === 'hundred' || t === 'thousand') && run.length) { run.push(t); continue; }
    if (t === 'point' && run.length && toks[i + 1] && (isWordNum(toks[i + 1]) || /^\d$/.test(toks[i + 1]))) { run.push('point'); locked = false; continue; }
    if (t === 'and' && run.some(x => x === 'hundred' || x === 'thousand') && toks[i + 1] && isWordNum(toks[i + 1])) continue;
    flush(); out.push(t);
  }
  flush();
  return ' ' + out.join(' ') + ' ';
}
function extractCallsign(s, known) {
  const matchDigits = (prefix, digits) => { for (let len = digits.length; len >= 1; len--) { const cs = prefix + digits.slice(0, len); if (known.includes(cs)) return { cs, rest: digits.slice(len) }; } return null; };
  let m = s.match(new RegExp('\\b(' + AIRLINES.map(a => a.icao.toLowerCase()).join('|') + ')\\s?(\\d{1,4})\\b'));
  if (m) { const pre = m[1].toUpperCase(), hit = matchDigits(pre, m[2]); return { cs: hit ? hit.cs : pre + m[2], unknown: !hit, idx: m.index, s: s.replace(m[0], ' ' + (hit ? hit.rest : '') + ' ') }; }
  for (const al of AIRLINES) for (const w of al.words) {
    m = s.match(new RegExp('\\b' + w + '\\s+(\\d{1,6})\\b'));
    if (m) { const hit = matchDigits(al.icao, m[1]); return { cs: hit ? hit.cs : al.icao + m[1], unknown: !hit, idx: m.index, s: s.replace(m[0], ' ' + (hit ? hit.rest : '') + ' ') }; }
  }
  for (const al of AIRLINES) for (const w of al.words) { const i = s.search(new RegExp('\\b' + w + '\\b')); if (i >= 0) return { cs: null, bare: al.tel, idx: i, s }; }
  return { cs: null, s };
}
const Q = w => (w === 'well' || w === 'way' || w === 'too' || w === 'very') ? 'well' : (w ? 'slightly' : null);
const SIDE = w => (w === 'left' ? 'L' : w === 'right' ? 'R' : (w === 'above' || w === 'high') ? 'above' : 'below');
// subset of the Approach / Final scope patterns (same regexes): the instructions the intro aircraft can fly
const PATTERNS = [

  if (recAlts.length === 1 && recAlts[0].length > 1) {   // choose the recognizer alternative the parser understands best
    const known = W.acs.map(a => a.cs); let best = text, bs = -1;
    for (const alt of recAlts[0]) { const q = parse(alt, known); const s = q.cmds.length * 2 + (q.cs && !q.csUnknown ? 3 : 0); if (s > bs) { bs = s; best = alt; } }

function stopRec() { if (!recOn) return; recOn = false; toggleMode = false; clearTimeout(finishTimer); try { rec && rec.abort(); } catch (e) {} const p = $('ptt'); if (p) p.classList.remove('live'); }
function recError(code) {

/* ===================== transmissions: parse → readback → aircraft flies it → Aero checks ===================== */
function readbackParts(a, cmds) {
  const parts = [];
  for (const c of cmds) {
    if (c.k === 'hdg') parts.push((c.dir ? (c.dir === 'L' ? 'left ' : 'right ') : '') + 'heading ' + sayDigits(h3(c.v)));
    else if (c.k === 'alt') { const chg = Math.abs(c.v - a.tgtAlt) > 50 || Math.abs(c.v - a.alt) > 50; parts.push((chg ? (c.v > a.alt ? 'climb and maintain ' : 'descend and maintain ') : 'maintain ') + (c.v % 100 === 0 && c.v < 18000 ? 'angels ' + angSay(c.v) : sayDigits(c.v) + ' feet')); }
    else if (c.k === 'spd') parts.push('maintain ' + sayDigits(c.v) + ' knots');
    else if (c.k === 'buster') parts.push('buster');
    else if (c.k === 'freq') parts.push('going ' + c.v);
    else if (c.k === 'clearLand') parts.push('cleared to land');
    else if (c.k === 'ga') parts.push('waving off');
  }

}
function execute(a, cmds) {
  for (const c of cmds) {
    if (c.k === 'hdg') { a.trackCL = false; a.mode = 'free'; a.tgtHdg = c.v % 360; a.turn = c.dir === 'L' ? -1 : c.dir === 'R' ? 1 : 0; }
    else if (c.k === 'alt') { a.tgtAlt = c.v; a.gpOn = false; }
    else if (c.k === 'spd') a.tgtSpd = Math.max(110, Math.min(500, c.v));
    else if (c.k === 'buster') a.tgtSpd = 500;
    else if (c.k === 'freq') { a.freq = c.v; updTag(); }
    else if (c.k === 'course' || c.k === 'onCourse') { if (a.freq === 'purple' || a.freq === 'copper') { a.trackCL = true; a.tgtHdg = null; a.turn = 0; } }
    else if (c.k === 'beginDescent') { a.gpOn = true; a.tgtAlt = Math.min(a.tgtAlt, a.alt); }
    else if (c.k === 'clearLand') a.cleared = true;
    else if (c.k === 'ga') { a.gpOn = false; a.cleared = false; a.trackCL = false; a.tgtAlt = Math.max(1200, a.tgtAlt); a.tgtHdg = 0; a.turn = 0; W.flash = { t: W.t, txt: 'WAVE OFF' }; }
  }
}
function describeNeed(n) {
  switch (n.k) {
    case 'hdg': return `turn ${n.dir === 'L' ? 'left' : 'right'} heading ${sayDigits(h3(n.v))}`;
    case 'alt': return `descend and maintain angels ${angSay(n.v)}`;
    case 'spd': return `maintain ${sayDigits(n.v)} knots`;
    case 'freq': return `go ${n.v}`;
    case 'course': return 'slightly left of course';

}
function evaluate(st, p) {
  const ex = st.expect, issues = [], tips = [];
  if (!p.cs) issues.push(p.bare ? `You said "${p.bare}" but not the <b>number</b>. With several Lightnings airborne, the pilot needs the full callsign: <b>${tel(ex.cs)}</b>.` : `No callsign. Start every call with <b>who</b> you're talking to: "<b>${tel(ex.cs)}</b>, …"`);
  else if (p.csLate) tips.push('Tip: put the callsign <b>first</b> so the pilot knows the call is for them before the instruction starts.');
  for (const n of ex.need) {
    const c = p.cmds.find(x => x.k === n.k);
    if (!c) { issues.push(`The task needed "<b>${describeNeed(n)}</b>", and I didn't hear that in your call.`); continue; }
    if (n.k === 'hdg') {
      if (c.v % 360 !== n.v % 360) issues.push(`You said heading <b>${sayDigits(h3(c.v))}</b> (${h3(c.v)}), but the task was <b>${h3(n.v)}</b>. The pilot flew exactly what you said.`);
      else if (c.dir && n.dir && c.dir !== n.dir) issues.push(`You said turn <b>${c.dir === 'L' ? 'left' : 'right'}</b>, but the task was a <b>${n.dir === 'L' ? 'left' : 'right'}</b> turn, so it went the long way around!`);
      else if (!c.dir && n.dir) tips.push(`Tip: "fly heading" lets the pilot pick the shorter way. "Turn <b>${n.dir === 'L' ? 'left' : 'right'}</b> heading…" removes any doubt.`);
    }
    if (n.k === 'alt' && c.v !== n.v) issues.push(`You said <b>${cmdStr(c)}</b>, but the task was <b>angels ${angTxt(n.v)}</b> (${n.v.toLocaleString('en-US')} ft).`);
    if (n.k === 'spd' && c.v !== n.v) issues.push(`You said <b>${c.v} knots</b>, but the task was <b>${n.v} knots</b>.`);
    if (n.k === 'freq' && c.v !== n.v) issues.push(`You sent it to <b>${c.v}</b>, but Final is waiting on <b>${n.v}</b>.`);
    if (n.k === 'course' && c.side !== n.side) issues.push(`It's <b>left</b> of the line, so the call is "slightly <b>left</b> of course". The pilot then corrects back right. Saying "right of course" made it drift further left.`);
  }
  const extra = p.cmds.filter(c => !ex.need.some(n => n.k === c.k) && !INFO_K.has(c.k));
  if (extra.length) issues.push(`You also said "<b>${extra.map(cmdStr).join('", "')}</b>", which wasn't part of this task, and the pilot did it anyway.`);

let txBusy = false;
function handleTx(raw, src) {
  const st = STEPS[cur]; if (st.type !== 'voice') return false;
  if (R.done) { feedback('info', 'Already done. <span class="ui">Tap <b>Next</b> to continue.</span>'); return false; }
  if (txBusy) return false;
  const a = W.acs.find(x => !x.landed); if (!a) return false;
  let text = raw;
  if (src === 'typed' && window.Shorthand) { try { const r = Shorthand.expand(raw, { scope: a.freq === 'purple' || a.freq === 'copper' ? 'final' : 'approach', airlines: AIRLINES, selected: tel(a.cs), callsigns: W.acs.map(x => ({ cs: x.cs, tel: tel(x.cs) })) }); if (r && r.shorthand) text = r.text; } catch (e) {} }
  const p = parse(text, W.acs.map(x => x.cs));
  const h = $('heard'); if (h) h.innerHTML = `${src === 'voice' ? 'Heard' : 'Sent'}: <b>${esc(text)}</b><br>Understood: ${p.cs ? esc(tel(p.cs)) : '<span style="color:var(--bad)">no callsign</span>'} · ${p.cmds.length ? esc(p.cmds.map(cmdStr).join(', ')) : '<span style="color:var(--bad)">no instruction</span>'}`;
  addLog('you', text); feedback('', '');
  txBusy = true;
  const wrongCs = p.cs && p.cs !== a.cs;
  setTimeout(() => {
    if (STEPS[cur] !== st) { txBusy = false; return; }
    if (wrongCs) { txBusy = false; addLog('sys', '(no answer)'); fail(st, `Nobody answered. You called <b>${esc(tel(p.cs))}</b>, but the aircraft is <b>${tel(a.cs)}</b>. With the wrong callsign, the right pilot ignores the call.`); return; }
    if (!p.cmds.length || p.hdgMissing) {
      txBusy = false; addLog('plt', `${tel(a.cs)}, unable.`); speak(telSay(a.cs) + ', unable.', 'pilot');
      fail(st, p.hdgMissing ? 'The pilot heard a turn but no usable <b>heading number</b>, so they answered <b>unable</b>. Say the heading as three digits.' : `The pilot couldn't pick out an instruction, so they answered <b>unable</b>. Try the call again.${src === 'voice' ? ' If the mic misheard you, speak a little slower, or type it.' : ''}`);

    }

    else addLog('sys', '(no readback: on final the pilot just corrects; routine calls aren\'t acknowledged)');

      txBusy = false;

      else fail(st, ev.issues.join('<br>') + (ev.tips.length ? '<br>' + ev.tips.join('<br>') : '') + '<br>Try again<span class="ui"> (tap <b>↺ Reset aircraft</b> if it wandered off)</span>.');

function onEvent(kind, a) {
  const st = STEPS[cur];

    addLog('sys', `${tel(a.cs)} is aboard. Trap!`);
    if (st.waitLand) { R.landed = true; if (st.id in res) { R.done = true; feedback('ok', `✅ <b>${tel(a.cs)} is safely aboard!</b> You just ran your first recovery. <span class="ui">Tap <b>Finish</b>.</span>`); speak(tel(a.cs) + ' is safely aboard. ' + userName() + ', you just ran your first recovery!', 'mentor'); updNav(); updProg(); try { $('bNext').focus({ preventScroll: true }); } catch (e) {} } }

/* ===================== completion ===================== */
function renderDone() {
  const got = GRADED.filter(s => res[s.id] === 1).length, tot = GRADED.length, pct = got / tot;
  const stars = pct >= 0.85 ? 3 : pct >= 0.6 ? 2 : 1;
  $('say').innerHTML = `<p><b>Mission complete.</b> Lightning 24 is safely aboard USS Stinger. Welcome to the team, ${esc(userName())}.</p>`;
  $('task').innerHTML = `<div class="row"><button id="bAgain">↺ Restart intro</button><button id="bResult">Show results</button></div>`;
  $('bAgain').onclick = restart; $('bResult').onclick = renderDone;
  updNav();
  openOv(`<h1>MISSION COMPLETE</h1><h2>First night recovery · USS Stinger</h2>
    <div class="stars" aria-label="${stars} of 3 stars">${'★'.repeat(stars)}<span class="e">${'★'.repeat(3 - stars)}</span></div>
    <p>${got} of ${tot} tasks right on the first try.</p>
    <p>${stars === 3 ? 'Outstanding. You\'re ready for the real trainers.' : stars === 2 ? 'Solid work. A few reps on the trainers and you\'ll be sharp.' : 'You got it aboard, and that\'s what counts. Replay the intro any time.'}</p>
    <p class="small">Next, try a trainer position:</p>
    <div class="btns">
      <a href="marshal-controller.html" class="f-red">Marshal · Red</a>
      <a href="approach-controller.html" class="f-silver">Approach · Silver</a>
      <a href="final-controller-par-restyled.html" class="f-purple">Final · Purple / Copper</a>
      <button id="ovRestart">↺ Restart intro</button>
      <a href="index.html" style="color:var(--dim);border-color:var(--gdd)">Home</a>
    </div>`);
  $('ovRestart').onclick = restart;
  speak(`Mission complete! ${got} of ${tot} on the first try. ${stars} star${stars > 1 ? 's' : ''}. Awesome flying with you, ${userName()}.`, 'mentor');
}
function openOv(html) { $('ovCard').innerHTML = html; $('ov').classList.add('open'); setTimeout(() => { const b = $('ovCard').querySelector('button,a'); if (b) try { b.focus({ preventScroll: true }); } catch (e) {} }, 30); }
function closeOv() { $('ov').classList.remove('open'); }
function restart() { hush(); res = {}; try { localStorage.removeItem(LS_KEY); } catch (e) {} closeOv(); show(0, true); }

/* ===================== input wiring ===================== */
const advance = () => { if (R.done && STEPS[cur].type !== 'done') show(cur + 1, false); };
$('bNext').onclick = advance;
$('bBack').onclick = () => { if (cur > 0) show(cur - 1, true); };
$('bMute').onclick = () => setMute(!muted);
$('bVoice').onclick = () => toggleVoicePanel();
$('vClose').onclick = () => toggleVoicePanel(false);
$('vSel').onchange = () => { try { localStorage.setItem(LS_VOICE, $('vSel').value); } catch (e) {} loadVoices(); hush(); speak(`Hi ${userName()}, this is how I'll sound.`, 'mentor'); };
$('vTest').onclick = () => { hush(); if (muted) setMute(false); speak(`Hi ${userName()}, I'm Aero, your guide. Let's bring them home.`, 'mentor'); speak('Stinger Approach, Lightning two four, angels four.', 'pilot'); };
$('bRestart').onclick = () => { if (confirm('Restart the intro from the beginning? Your progress will be cleared.')) restart(); };
$('ov').addEventListener('keydown', e => { if (e.key === 'Escape' && STEPS[cur].type === 'done') closeOv(); });
cv.addEventListener('pointerdown', e => {
  const st = STEPS[cur]; if (st.type !== 'click' || R.done) return;
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  let best = null, bd = 34; for (const a of W.acs) if (a.hit) { const d = Math.hypot(a.hit.x - x, a.hit.y - y); if (d < bd) { bd = d; best = a; } }
  if (best) clickAc(st, best.cs); else feedback('info', 'Tap right on a target (the small marks with text beside them).');
});
const inField = e => e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA');
document.addEventListener('keydown', e => {
  if ($('ov').classList.contains('open') || document.getElementById('aatccGate')) return;
  const st = STEPS[cur];
  if (e.code === 'Space' && st.type === 'voice' && !inField(e)) { e.preventDefault(); if (!e.repeat && !recOn) { toggleMode = false; pressT = performance.now(); pttStart(); } return; }
  if (inField(e) || e.ctrlKey || e.metaKey || e.altKey) return;
  const onBtn = e.target && (e.target.tagName === 'BUTTON' || e.target.tagName === 'A');
  if ((e.key === 'Enter' && !onBtn) || e.key === 'ArrowRight') { if (R.done) { e.preventDefault(); advance(); } return; }
  if (e.key === 'ArrowLeft' && cur > 0) { show(cur - 1, true); return; }
  if (e.key === 'm' || e.key === 'M') { setMute(!muted); return; }
  if (e.key === 'Escape' && $('vpick').classList.contains('open')) { toggleVoicePanel(false); return; }
  if (/^[1-9]$/.test(e.key)) {
    const i = +e.key - 1;
    if (st.type === 'choice') { const b = $('task').querySelectorAll('.opts button')[i]; if (b && !b.disabled) b.click(); }
    else if (st.type === 'click' && W.acs[i]) clickAc(st, W.acs[i].cs);
  }
});
document.addEventListener('keyup', e => { if (e.code === 'Space' && recOn && !toggleMode && !inField(e)) { e.preventDefault(); pttEnd(); } });

/* ===================== boot ===================== */
buildProg(); setMute(muted); resize(); requestAnimationFrame(frame);
(function boot() {
  const saved = load(), resume = saved && saved.i > 0 && saved.i < STEPS.length - 1 ? saved : null;
  if (resume) { cur = resume.i; res = resume.res || {}; }
  setScene(STEPS[cur], true); updProg(); $('say').innerHTML = sayOf(STEPS[cur]); updNav();
  // nothing speaks until the first tap (iOS needs a user gesture for audio)
  const go = `style="background:#123f1a;border-color:var(--g);color:#d8ffde;font-weight:bold"`;
  openOv(`<h1>FIRST NIGHT ABOARD STINGER</h1><h2>A guided intro to air traffic control</h2>

    <p class="small">About 10 minutes · progress saves automatically · 🔊 voices on (toggle with the speaker button or M)</p>
    <div class="btns">${resume ? `<button id="ovGo" ${go}>Continue: ${CHAPTERS[STEPS[cur].ch]}, step ${cur + 1}</button><button id="ovRe">↺ Restart from the beginning</button>` : `<button id="ovGo" ${go}>Meet Aero ▸</button>`}</div>`);
  $('ovGo').onclick = () => { closeOv(); show(cur, true); };
  if ($('ovRe')) $('ovRe').onclick = restart;

/* test hook for headless tests: inject a recognized string exactly as the voice path delivers it */

  inject: t => handleTx(t, 'voice'), type: t => handleTx(t, 'typed'), parse: t => parse(t, W.acs.map(a => a.cs)),
  get i() { return cur; }, get id() { return STEPS[cur].id; }, get type() { return STEPS[cur].type; }, get done() { return R.done; }, name: n => setName(STEPS[cur], n), speechOf: h => chunks(h).map(c => c.t), voice: () => ({ aero: aeroV && aeroV.name, pilot: pilotV && pilotV.name }), score: n => voiceScore({ name: n, lang: 'en-US' }),
  acs: () => W.acs.map(a => ({ cs: a.cs, x: +a.x.toFixed(2), y: +a.y.toFixed(2), hdg: Math.round(a.hdg) % 360, tgtHdg: a.tgtHdg, turn: a.turn, alt: Math.round(a.alt), tgtAlt: a.tgtAlt, spd: Math.round(a.spd), tgtSpd: a.tgtSpd, freq: a.freq, gpOn: a.gpOn, trackCL: a.trackCL, cleared: a.cleared, landed: a.landed, hit: a.hit ? { x: Math.round(a.hit.x), y: Math.round(a.hit.y) } : null })),
